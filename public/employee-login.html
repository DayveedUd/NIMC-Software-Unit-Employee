<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NIMC Employee Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpeg" href="NIMC-logo.png">
<link rel="stylesheet" href="employee-login.css">
</head>
<body>

  <form class="card" id="loginForm">

    <div class="header">
      <div class="logo-circle">
        <img src="NIMC-logo.png" alt="NIMC logo" />
      </div>
      <h1>Employee Login</h1>
      <p>Access your profile and details</p>
    </div>

    <div class="body">

      <div class="status-message" id="statusMessage"></div>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="username" />
        <span class="error-message" id="usernameError">Username is required</span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <span class="error-message" id="passwordError">Password is required</span>
      </div>

      <div class="remember-me">
        <input type="checkbox" id="rememberMe" />
        <label for="rememberMe" style="margin: 0;">Remember me</label>
      </div>

    </div>

    <div class="footer">
      <button type="submit" class="login-btn" id="loginBtn">Login</button>
      <div class="signup-link">
        Don't have an account? <a href="/registration.html">Create one</a>
      </div>
      <div class="admin-link">
        <a href="/login.html">Admin Login</a>
      </div>
    </div>

  </form>

 <script src="employee-login.js"></script>

</body>
</html>
