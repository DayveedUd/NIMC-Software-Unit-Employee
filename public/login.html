<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NIMC Admin Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="NIMC-logo.png">
<link rel="stylesheet" href="login.css">
</head>
<body>

  <form class="card" id="loginForm">

    <div class="header">
      <div class="logo-circle">
        <img src="NIMC-logo.png" alt="NIMC logo" />
      </div>
      <h1>Admin login</h1>
      <p>Sign in to manage registered employees</p>
    </div>

    <div class="body">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" autocomplete="current-password" />
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <p class="error-message" id="loginError"></p>
    </div>

    <div class="footer">
      <button type="submit" class="login-btn" id="loginBtn">Log in</button>
       <div class="employee-link">
        <a href="/employee-login.html">Employee Login</a>
      </div>
    </div>

  </form>

    </div>

  <script src="login.js"></script>

</body>
</html>
