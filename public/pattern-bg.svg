<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
  <defs>
    <pattern id="doodles" width="150" height="150" patternUnits="userSpaceOnUse">
      <rect width="150" height="150" fill="#F3F1EA"/>
      <g fill="none" stroke="#E4DFCE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- leaf -->
        <path d="M20 30 Q30 10 45 25 Q30 40 20 30 Z"/>
        <path d="M22 30 Q30 25 40 25"/>
        <!-- circle w/ dot -->
        <circle cx="95" cy="20" r="9"/>
        <circle cx="95" cy="20" r="2" fill="#E4DFCE"/>
        <!-- star -->
        <path d="M120 55 l3 7 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 l7 -1 Z"/>
        <!-- cloud -->
        <path d="M15 80 a8 8 0 0 1 15 -3 a7 7 0 0 1 12 4 a6 6 0 0 1 -2 12 h-22 a6 6 0 0 1 -3 -13 Z"/>
        <!-- small house -->
        <path d="M60 100 l14 -12 l14 12 v18 h-28 Z"/>
        <path d="M68 118 v-10 h12 v10"/>
        <!-- wavy line -->
        <path d="M95 95 q7 -8 14 0 t14 0"/>
        <!-- flower -->
        <circle cx="130" cy="115" r="4"/>
        <circle cx="123" cy="110" r="4"/>
        <circle cx="137" cy="110" r="4"/>
        <circle cx="123" cy="120" r="4"/>
        <circle cx="137" cy="120" r="4"/>
        <!-- crescent moon -->
        <path d="M40 130 a10 10 0 1 0 8 -17 a13 13 0 1 1 -8 17 Z"/>
        <!-- triangle mountain -->
        <path d="M0 145 l10 -18 l10 18 Z"/>
        <!-- squiggle -->
        <path d="M105 5 q5 8 0 14 q-5 6 0 14"/>
      </g>
    </pattern>
  </defs>
  <rect width="300" height="300" fill="url(#doodles)"/>
</svg>
