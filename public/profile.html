<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NIMC Software Unit Profile Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400&display=swap" rel="stylesheet">
<style>

  /* ---------- 1. Reset & base styles ---------- */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: "Work Sans", sans-serif;
    background: #F3F1EA url(pattern-bg.svg) repeat;
    padding: 12px 16px;
    display: flex;
    align-items: center;      /* vertically centers the card */
    justify-content: center;
    overflow: hidden;         /* no page scroll */
  }

  /* ---------- 2. The white card that holds the whole profile ---------- */
  .card {
    max-width: 600px;
    width: 100%;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 16px;
    border: 1px solid #E4E6E0;
    overflow: hidden;         /* keeps the green header's corners rounded too */
    max-height: 96vh;
    overflow-y: auto;         /* scrolls inside the card only if truly needed */
  }

  /* ---------- 3. Green header section ---------- */
  .header {
    background: #0B6E4F;
    padding: 24px 24px 32px;
    text-align: center;
    position: relative;
  }

  .back-btn {
    position: absolute;
    top: 24px;
    left: 24px;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.12);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .back-btn svg {
    width: 16px;
    height: 16px;
  }

  .logo-circle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    padding: 6px;
    overflow: hidden;
  }

  .logo-circle img {
    width: 130%;
    height: 130%;
    object-fit: contain;
  }

  .header h1 {
    color: #ffffff;
    font-size: 20px;
    font-weight: 700;
    font-family: "Poppins", sans-serif;
  }

  .header p {
    color: rgba(255, 255, 255, 0.72);
    font-size: 12px;
    margin-top: 4px;
  }

  /* ---------- 4. Avatar + name block ---------- */
  .identity {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 24px 20px;
  }

  .avatar-wrap {
    position: relative;
    margin-bottom: 16px;
  }

  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: #E3F1EA;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 15%;
  }

  .avatar svg {
    width: 36px;
    height: 36px;
  }

  /* Small camera button overlaid on the avatar, only shown while editing */
  .avatar-edit-btn {
    display: none;
    position: absolute;
    bottom: 0;
    right: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #0B6E4F;
    border: 2px solid #ffffff;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .avatar-edit-btn svg {
    width: 14px;
    height: 14px;
  }

  .editing .avatar-edit-btn {
    display: flex;
  }

  .identity .name {
    font-size: 20px;
    font-weight: 700;
    color: #16241D;
    text-align: center;
  }

  .badge {
    margin-top: 8px;
    background: #E3F1EA;
    color: #0B6E4F;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: 999px;
  }

  /* Name/position inputs shown only in edit mode, in place of the static text above */
  .name-input-row {
    display: none;
    gap: 8px;
    width: 100%;
    max-width: 340px;
    margin-top: 4px;
  }

  .editing .name-input-row {
    display: flex;
  }

  .editing .name,
  .editing .badge {
    display: none;
  }

  .position-select {
    display: none;
    margin-top: 10px;
    width: 100%;
    max-width: 200px;
  }

  .editing .position-select {
    display: block;
  }

  /* ---------- Admin action buttons (Edit / Delete / Save / Cancel) ---------- */
  .admin-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    border: 1px solid transparent;
  }

  .action-btn svg {
    width: 14px;
    height: 14px;
  }

  .action-btn.edit {
    background: #E3F1EA;
    color: #0B6E4F;
  }

  .action-btn.edit:hover {
    background: #d3e9de;
  }

  .action-btn.delete {
    background: #FBEAEA;
    color: #C0392B;
  }

  .action-btn.delete:hover {
    background: #f6d9d9;
  }

  .action-btn.save {
    background: #0B6E4F;
    color: #ffffff;
  }

  .action-btn.save:hover {
    background: #095C42;
  }

  .action-btn.cancel {
    background: #F6F7F5;
    color: #5B6660;
    border-color: #E4E6E0;
  }

  .action-btn.cancel:hover {
    background: #eceeea;
  }

  .action-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .view-mode-actions,
  .edit-mode-actions {
    display: flex;
    gap: 10px;
  }

  .edit-mode-actions {
    display: none;
  }

  .editing .view-mode-actions {
    display: none;
  }

  .editing .edit-mode-actions {
    display: flex;
  }

  /* ---------- 5. Info sections ---------- */
  .body {
    padding: 0 28px 28px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    color: #9AA39C;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 20px 0 10px;
  }

  .row {
    display: flex;
    gap: 14px;
  }

  .field {
    flex: 1;
    margin-bottom: 12px;
  }

  .field label {
    display: block;
    font-size: 10px;
    font-weight: 600;
    color: #5B6660;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 4px;
  }

  .field .value {
    width: 100%;
    min-height: 32px;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid #E4E6E0;
    background: #F6F7F5;
    font-size: 13px;
    color: #16241D;
    display: flex;
    align-items: center;
  }

  /* Editable inputs, styled to match the registration form, hidden until edit mode */
  .field .edit-input {
    display: none;
    width: 100%;
    height: 32px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid #D8DBD5;
    font-size: 13px;
    color: #16241D;
    background: #ffffff;
    font-family: inherit;
  }

  .field .edit-input:focus {
    outline: none;
    border-color: #0B6E4F;
  }

  .editing .field .value {
    display: none;
  }

  .editing .field .edit-input {
    display: block;
  }

  /* ---------- 6. Work days row ---------- */
  .days {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .day {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid #D8DBD5;
    background: #ffffff;
    color: #5B6660;
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .editing .day {
    cursor: pointer;
  }

  .day.active {
    background: #0B6E4F;
    border-color: #0B6E4F;
    color: #ffffff;
  }

  /* ---------- 7. Loading / error state ---------- */
  .status-message {
    padding: 60px 28px;
    text-align: center;
    font-size: 14px;
    color: #7C867F;
  }
/* ---------- Responsive ---------- */
  @media (max-width: 480px) {
    body {
      padding: 0;
      align-items: flex-start;
      overflow-y: auto;
    }

    .card {
      max-width: 100%;
      max-height: none;
      border-radius: 0;
      border: none;
      overflow-y: visible;
    }

    .header {
      padding: 20px 20px 28px;
    }

    .identity {
      padding: 24px 20px 16px;
    }

    .body {
      padding: 0 20px 20px;
    }

    .row {
      flex-direction: column;
      gap: 0;
    }

    .admin-actions {
      flex-wrap: wrap;
      justify-content: center;
    }
  }

  @media (max-height: 600px) {
    body {
      align-items: flex-start;
      overflow-y: auto;
    }

    .card {
      max-height: none;
    }
  }
  
</style>
</head>
<body>

  <div class="card" id="profileCard">

    <!-- Green header with back button, logo, title -->
    <div class="header">
      <button type="button" class="back-btn" onclick="window.location.href='admin-dashboard.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="logo-circle">
        <img src="nimc-logo.jfif" alt="NIMC logo" />
      </div>
      <h1>Employee Profile</h1>
    </div>

    <!-- Shown while fetching, or if the employee can't be found/loaded -->
    <p class="status-message" id="statusMessage">Loading profile...</p>

    <!-- Actual profile content -- hidden until data loads successfully -->
    <div id="profileContent" style="display: none;">

      <!-- Avatar, name, role badge -->
      <div class="identity">

        <div class="avatar-wrap">
          <span class="avatar" id="avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0B6E4F" stroke-width="2">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
            </svg>
          </span>
          <!-- Only visible while editing; opens the file picker below -->
          <label for="photoInput" class="avatar-edit-btn" title="Change photo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
              <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
              <path d="M12 12V3M12 3l-4 4M12 3l4 4"/>
            </svg>
          </label>
          <input type="file" id="photoInput" accept="image/*" style="display:none" />
        </div>

        <div class="name" id="fullName"></div>
        <span class="badge" id="positionBadge"></span>

        <!-- Editable name fields -- shown only in edit mode -->
        <div class="name-input-row">
          <input type="text" class="edit-input" id="firstNameInput" placeholder="First name" style="display:block;">
          <input type="text" class="edit-input" id="lastNameInput" placeholder="Last name" style="display:block;">
        </div>
        <select class="edit-input position-select" id="positionInput">
          <option>Corp Member</option>
          <option>Intern</option>
        </select>

        <!-- Admin action buttons -->
        <div class="admin-actions">
          <div class="view-mode-actions">
            <button type="button" class="action-btn edit" id="editBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 20h9"/>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
              </svg>
              Edit
            </button>
            <button type="button" class="action-btn delete" id="deleteBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18"/>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              </svg>
              Delete
            </button>
          </div>
          <div class="edit-mode-actions">
            <button type="button" class="action-btn cancel" id="cancelBtn">Cancel</button>
            <button type="button" class="action-btn save" id="saveBtn">Save changes</button>
          </div>
        </div>

      </div>

      <!-- Info sections -->
      <div class="body">

        <p class="section-label">Contact</p>
        <div class="row">
          <div class="field">
            <label>Phone no.</label>
            <div class="value" id="phoneValue"></div>
            <input type="tel" class="edit-input" id="phoneInput">
          </div>
          <div class="field">
            <label>Email</label>
            <div class="value" id="emailValue"></div>
            <input type="email" class="edit-input" id="emailInput">
          </div>
        </div>

        <p class="section-label">Academic details</p>
        <div class="field">
          <label>School</label>
          <div class="value" id="schoolValue"></div>
          <input type="text" class="edit-input" id="schoolInput">
        </div>
        <div class="row">
          <div class="field">
            <label>Discipline</label>
            <div class="value" id="disciplineValue"></div>
            <input type="text" class="edit-input" id="disciplineInput">
          </div>
          <div class="field">
            <label>Skill</label>
            <div class="value" id="skillValue"></div>
            <input type="text" class="edit-input" id="skillInput">
          </div>
        </div>

        <p class="section-label">Work days</p>
        <div class="days" id="daysRow">
          <span class="day" data-day="Mo">Mo</span>
          <span class="day" data-day="Tu">Tu</span>
          <span class="day" data-day="We">We</span>
          <span class="day" data-day="Th">Th</span>
          <span class="day" data-day="Fr">Fr</span>
        </div>

      </div>

    </div>

  </div>

  <script>
    // ---------------------------------------------------------------
    // AUTH GUARD -- must be logged in to view/edit/delete a profile
    // ---------------------------------------------------------------
    const adminToken = localStorage.getItem("adminToken");

    if (!adminToken) {
      window.location.href = "login.html";
    }

    const statusMessage = document.getElementById("statusMessage");
    const profileContent = document.getElementById("profileContent");
    const profileCard = document.getElementById("profileCard");

    const editBtn = document.getElementById("editBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const saveBtn = document.getElementById("saveBtn");
    const photoInput = document.getElementById("photoInput");
    const avatar = document.getElementById("avatar");

    let currentEmployee = null;   // the last-loaded data from the server
    let selectedPhotoFile = null; // a newly chosen photo, if any, while editing

    // Read the employee's MongoDB _id from the URL, e.g. profile.html?id=64f...
    const params = new URLSearchParams(window.location.search);
    const employeeId = params.get("id");

    // ---------------------------------------------------------------
    // DISPLAY (view mode)
    // ---------------------------------------------------------------

    function renderProfile(data) {
      currentEmployee = data;

      const fullName = `${data.firstName} ${data.lastName}`;
      document.getElementById("fullName").textContent = fullName;
      document.getElementById("positionBadge").textContent = data.position;
      document.getElementById("phoneValue").textContent = data.phone;
      document.getElementById("emailValue").textContent = data.email;
      document.getElementById("schoolValue").textContent = data.school;
      document.getElementById("disciplineValue").textContent = data.discipline;
      document.getElementById("skillValue").textContent = data.skill;

      document.querySelectorAll(".day").forEach(dayEl => {
        dayEl.classList.toggle("active", data.workDays.includes(dayEl.dataset.day));
      });

      avatar.innerHTML = data.photoUrl
        ? `<img src="${data.photoUrl}" alt="${fullName}" />`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="#0B6E4F" stroke-width="2">
             <circle cx="12" cy="8" r="4"/>
             <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
           </svg>`;

      statusMessage.style.display = "none";
      profileContent.style.display = "block";
    }

    async function loadProfile() {
      if (!employeeId) {
        statusMessage.textContent = "No employee selected.";
        return;
      }

      try {
        const response = await fetch(`/api/employees/${employeeId}`, {
          headers: {
            "Authorization": `Bearer ${adminToken}`
          }
        });

        if (response.status === 401) {
          localStorage.removeItem("adminToken");
          window.location.href = "login.html";
          return;
        }

        if (response.status === 404) {
          statusMessage.textContent = "Employee not found.";
          return;
        }

        if (!response.ok) {
          throw new Error("Failed to load employee");
        }

        const employee = await response.json();
        renderProfile(employee);

      } catch (error) {
        console.error(error);
        statusMessage.textContent = "Could not load profile. Is the server running?";
      }
    }

    // ---------------------------------------------------------------
    // EDIT MODE
    // ---------------------------------------------------------------

    function enterEditMode() {
      // Pre-fill every input with the currently displayed data
      document.getElementById("firstNameInput").value = currentEmployee.firstName;
      document.getElementById("lastNameInput").value = currentEmployee.lastName;
      document.getElementById("positionInput").value = currentEmployee.position;
      document.getElementById("phoneInput").value = currentEmployee.phone;
      document.getElementById("emailInput").value = currentEmployee.email;
      document.getElementById("schoolInput").value = currentEmployee.school;
      document.getElementById("disciplineInput").value = currentEmployee.discipline;
      document.getElementById("skillInput").value = currentEmployee.skill;

      selectedPhotoFile = null;
      photoInput.value = "";

      profileCard.classList.add("editing");
    }

    function exitEditMode() {
      profileCard.classList.remove("editing");
      selectedPhotoFile = null;
    }

    editBtn.addEventListener("click", enterEditMode);

    cancelBtn.addEventListener("click", function () {
      exitEditMode();
      renderProfile(currentEmployee); // discard any unsaved changes, redraw from last known-good data
    });

    // Work day circles become clickable only while editing
    document.querySelectorAll(".day").forEach(dayEl => {
      dayEl.addEventListener("click", function () {
        if (profileCard.classList.contains("editing")) {
          this.classList.toggle("active");
        }
      });
    });

    // Preview a newly chosen photo immediately, before saving
    photoInput.addEventListener("change", function () {
      if (this.files && this.files.length > 0) {
        selectedPhotoFile = this.files[0];
        const previewUrl = URL.createObjectURL(selectedPhotoFile);
        avatar.innerHTML = `<img src="${previewUrl}" alt="New photo preview" />`;
      }
    });

    // ---------------------------------------------------------------
    // SAVE (PUT /api/employees/:id)
    // ---------------------------------------------------------------

    saveBtn.addEventListener("click", async function () {

      const formData = new FormData();
      formData.append("firstName", document.getElementById("firstNameInput").value.trim());
      formData.append("lastName", document.getElementById("lastNameInput").value.trim());
      formData.append("position", document.getElementById("positionInput").value);
      formData.append("phone", document.getElementById("phoneInput").value.trim());
      formData.append("email", document.getElementById("emailInput").value.trim());
      formData.append("school", document.getElementById("schoolInput").value.trim());
      formData.append("discipline", document.getElementById("disciplineInput").value.trim());
      formData.append("skill", document.getElementById("skillInput").value.trim());

      document.querySelectorAll(".day.active").forEach(day => {
        formData.append("workDays", day.dataset.day);
      });

      if (selectedPhotoFile) {
        formData.append("photo", selectedPhotoFile);
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      try {
        const response = await fetch(`/api/employees/${employeeId}`, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${adminToken}`
          },
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          alert(data.message || "Update failed.");
          return;
        }

        exitEditMode();
        renderProfile(data.employee);

      } catch (error) {
        console.error(error);
        alert("Update failed. Is the server running?");

      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save changes";
      }

    });

    // ---------------------------------------------------------------
    // DELETE (DELETE /api/employees/:id)
    // ---------------------------------------------------------------

    deleteBtn.addEventListener("click", async function () {

      const fullName = currentEmployee ? `${currentEmployee.firstName} ${currentEmployee.lastName}` : "this employee";
      const confirmed = confirm(`Delete ${fullName}? This can't be undone.`);

      if (!confirmed) {
        return;
      }

      deleteBtn.disabled = true;

      try {
        const response = await fetch(`/api/employees/${employeeId}`, {
          method: "DELETE",
          headers: {
            "Authorization": `Bearer ${adminToken}`
          }
        });

        const data = await response.json();

        if (!response.ok) {
          alert(data.message || "Delete failed.");
          deleteBtn.disabled = false;
          return;
        }

        alert(data.message);
        window.location.href = "admin-dashboard.html";

      } catch (error) {
        console.error(error);
        alert("Delete failed. Is the server running?");
        deleteBtn.disabled = false;
      }

    });

    loadProfile();
  </script>

</body>
</html>
